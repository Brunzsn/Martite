[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
martite = { path = "crates/martite", version = "0.1.0" }
martite-base = { path = "crates/martite-base", version = "0.1.0" }
martite-fuel = { path = "crates/martite-fuel", version = "0.1.0" }
martite-syntax = { path = "crates/martite-syntax", version = "0.1.0" }
martite-config = { path = "crates/martite-config", version = "0.1.0" }
martite-resolve = { path = "crates/martite-resolve", version = "0.1.0" }
martite-check = { path = "crates/martite-check", version = "0.1.0" }
martite-runtime = { path = "crates/martite-runtime", version = "0.1.0" }
martite-driver = { path = "crates/martite-driver", version = "0.1.0" }
martite-lint = { path = "crates/martite-lint", version = "0.1.0" }
martite-fmt = { path = "crates/martite-fmt", version = "0.1.0" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.2.0"
libm = "0.2.16"
stacker = "0.1.25"
indexmap = "2.14"
smallvec = "1.15"
cap-std = "4.0"
blake3 = "1.8"
lexopt = "0.3.2"
proptest = "1.12"
rustc-hash = "2.1"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
overflow-checks = true

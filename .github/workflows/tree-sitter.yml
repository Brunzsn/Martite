name: Tree-sitter and Zed

on:
  push:
    paths:
      - "externals/tree-sitter-martite/**"
      - "externals/zed-martite/**"
      - ".zed/tasks.json"
      - "examples/**"
      - "crates/martite-conformance/fixtures/**"
      - "crates/martite-fmt/tests/fixtures/**"
      - "crates/martite-cli/tests/fixtures/**"
      - ".github/workflows/tree-sitter.yml"
  pull_request:
    paths:
      - "externals/tree-sitter-martite/**"
      - "externals/zed-martite/**"
      - ".zed/tasks.json"
      - "examples/**"
      - "crates/martite-conformance/fixtures/**"
      - "crates/martite-fmt/tests/fixtures/**"
      - "crates/martite-cli/tests/fixtures/**"
      - ".github/workflows/tree-sitter.yml"
  workflow_dispatch:

jobs:
  grammar:
    name: tree-sitter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: externals/tree-sitter-martite
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun ci
      - run: bun run check
      - name: Verify generated files are committed
        working-directory: .
        run: >-
          git diff --exit-code --
          externals/tree-sitter-martite/grammar.js
          externals/tree-sitter-martite/src
          externals/tree-sitter-martite/queries
          externals/zed-martite

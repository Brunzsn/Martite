[package]
name = "martite-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line toolchain for the Martite language"
publish = false

[[bin]]
name = "martite"
path = "src/main.rs"

[features]
default = ["ast-eval"]
# Temporary #115 escape hatch. Remove with the AST evaluator in #116.
ast-eval = ["martite/ast-eval", "martite-runtime/ast-eval"]

[dependencies]
martite.workspace = true
martite-base.workspace = true
martite-config.workspace = true
martite-syntax.workspace = true
martite-resolve.workspace = true
martite-check.workspace = true
martite-ir.workspace = true
martite-runtime.workspace = true
martite-driver.workspace = true
martite-lint.workspace = true
martite-fmt.workspace = true
lexopt.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true

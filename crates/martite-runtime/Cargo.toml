[package]
name = "martite-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tree-walking interpreter and standard library for Martite"
publish = false

[features]
default = []
# Temporary escape hatch for #115. The IR evaluator is the default; this
# feature keeps the frozen AST evaluator and its checker/parser inputs
# available to `martite --ast`, the conformance oracle and #116's retirement
# window.
ast-eval = ["dep:martite-check", "dep:martite-syntax"]

[dependencies]
martite-base.workspace = true
martite-fuel.workspace = true
martite-ir.workspace = true
martite-syntax = { workspace = true, optional = true }
martite-check = { workspace = true, optional = true }
libm.workspace = true
serde_json.workspace = true
indexmap.workspace = true
smallvec.workspace = true

[lints]
workspace = true

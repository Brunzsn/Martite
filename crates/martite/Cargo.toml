[package]
name = "martite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embedding API for the Martite language"
publish = false

[features]
default = []
# Temporary #115 escape hatch: keep the frozen AST evaluator available for
# `martite --ast` until #116 retires it.
ast-eval = ["martite-runtime/ast-eval"]

[dependencies]
martite-base.workspace = true
martite-config.workspace = true
martite-syntax.workspace = true
martite-resolve.workspace = true
martite-check.workspace = true
martite-ir.workspace = true
martite-runtime.workspace = true
martite-driver.workspace = true
toml.workspace = true
blake3.workspace = true

[lints]
workspace = true

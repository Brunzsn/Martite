[package]
name = "martite-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
martite-base = { path = "../crates/martite-base" }
martite-syntax = { path = "../crates/martite-syntax" }
martite-runtime = { path = "../crates/martite-runtime" }
martite-driver = { path = "../crates/martite-driver" }

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false

[[bin]]
name = "checker"
path = "fuzz_targets/checker.rs"
test = false
doc = false

[workspace]
